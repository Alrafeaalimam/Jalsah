name: Build & Publish Jalsah Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Official Jalsah Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Official Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Jalsah.apk
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Jalsah.apk
          ls -lh Jalsah.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jalsah-APK
          path: Jalsah.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          git push --delete origin v1.0.0 || true
          gh release create v1.0.0 Jalsah.apk \
            --title "Jalsah v1.0.0 (Official Release)" \
            --notes "النسخة الرسمية لتطبيق جلسة (Jalsah) المتصلة بالخادم السحابي المباشر: https://mikrotik-cards-backend.onrender.com"
